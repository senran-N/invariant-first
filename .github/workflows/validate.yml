name: Validate skill package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check source catalogs
        run: python scripts/catalog.py --check
      - name: Test source package
        run: python -m unittest discover -s tests -v
      - name: Export single-entry package
        run: python scripts/export_single.py --output "$RUNNER_TEMP/runtime/invariant-first"
      - name: Check runtime catalogs
        working-directory: ${{ runner.temp }}/runtime/invariant-first
        run: python scripts/catalog.py --check
      - name: Test runtime package
        working-directory: ${{ runner.temp }}/runtime/invariant-first
        run: python -m unittest discover -s tests -v
      - name: Archive tested source and runtime
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.10'
        run: |
          git archive --format=zip --prefix=invariant-first/ --output="$RUNNER_TEMP/invariant-first-source.zip" HEAD
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          runtime = temp / "runtime" / "invariant-first"
          with zipfile.ZipFile(temp / "skill.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(runtime.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(runtime.parent))
          PY
      - name: Upload tested packages
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.10'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: invariant-first-packages
          path: |
            ${{ runner.temp }}/invariant-first-source.zip
            ${{ runner.temp }}/skill.zip
          if-no-files-found: error
          retention-days: 7
